# The Kickbase API proxy — a complete nginx.conf for OpenResty.
#
# Kickbase stopped sending CORS headers in autumn 2026, so a browser can no
# longer call api.kickbase.com from a page it did not serve. This server sits
# in front of it and does two things the upstream does not:
#
#   1. answers the CORS preflight (OPTIONS) itself, with the methods and
#      headers the app actually uses, instead of forwarding it;
#   2. stamps Access-Control-Allow-Origin on every real response — including
#      Kickbase's 401 and 403, which the app has to be able to read.
#
# Everything else passes through untouched: path, query, body, status, the
# Authorization bearer. There is no state and no secret in here.
#
# Locally: scripts/run-proxy starts it in the official OpenResty image on
# http://localhost:3018, and `npm run dev` reaches it with
# VITE_API_BASE_URL=http://localhost:3018 in .env.development. On the real
# server, TLS belongs in front of this (or add `listen 443 ssl` and the
# certificate lines to the server block below) — the location block is the
# part that matters and is the same in both places.

worker_processes  auto;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr [$time_local] "$request" $status '
                      '$body_bytes_sent origin="$http_origin" ua="$http_user_agent"';
    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Which pages may use this proxy. Reflecting a known origin rather than
    # answering "*" keeps the list explicit; a browser on any other site gets
    # an empty header and the request fails on its side. Add a line per
    # origin that should work — the deployed app, and the dev server with the
    # port from vite.config.ts.
    map $http_origin $cors_origin {
        default                       "";
        "https://fundreas.github.io"  $http_origin;
        "http://localhost:3011"       $http_origin;
        "http://127.0.0.1:3011"       $http_origin;
    }

    # The upstream is resolved once, at startup, because proxy_pass below names
    # it literally. Kickbase sits behind Cloudflare, whose addresses are stable
    # enough for that; a `resolver` directive would be needed only with a
    # variable in proxy_pass.

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        location = /healthz {
            access_log  off;
            default_type  text/plain;
            return  200  "ok\n";
        }

        location / {
            # The preflight never reaches Kickbase. Its answer is what the
            # browser needs to allow the real request: methods (the app uses
            # GET, POST and DELETE) and request headers (exactly the four the
            # axios instance in src/api/client.ts sets). Max-Age lets the
            # browser skip the preflight for a day per URL.
            if ($request_method = OPTIONS) {
                add_header  Access-Control-Allow-Origin   $cors_origin  always;
                add_header  Access-Control-Allow-Methods  "GET, POST, DELETE, OPTIONS"  always;
                add_header  Access-Control-Allow-Headers  "Authorization, Content-Type, Accept, Accept-Language"  always;
                add_header  Access-Control-Max-Age        86400  always;
                add_header  Vary                          Origin  always;
                return  204;
            }

            # `always` is the important word: without it nginx adds the header
            # to 2xx and 3xx only, and the browser would hide Kickbase's 401
            # (wrong password) and 403 (dead token) from the app — which
            # would then report "nicht erreichbar" instead of the real reason.
            add_header  Access-Control-Allow-Origin  $cors_origin  always;
            add_header  Vary                         Origin  always;

            proxy_pass             https://api.kickbase.com;
            proxy_http_version     1.1;
            proxy_ssl_server_name  on;
            proxy_ssl_protocols    TLSv1.2 TLSv1.3;
            proxy_set_header       Host        api.kickbase.com;
            proxy_set_header       Connection  "";

            # Kickbase sends no CORS headers today. Should it start again, two
            # Allow-Origin values on one response are an error in the browser,
            # so the upstream's are dropped in favour of ours.
            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;

            # A bearer-scoped answer must not be cached by anything between
            # here and the phone. Kickbase already says so; this keeps it true
            # if that changes.
            proxy_hide_header  Cache-Control;
            add_header         Cache-Control  "no-store"  always;

            proxy_connect_timeout  10s;
            proxy_read_timeout     30s;
        }
    }
}
