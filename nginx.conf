# Full replacement for the stock nginx.conf: one server, no conf.d include,
# and every path nginx writes to under /tmp so it can run as an unprivileged
# user. Serves a single-page app — hashed assets forever, index.html never.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The stock locations for these sit under /var/cache/nginx, which the
    # nginx user cannot write to.
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json font/woff2;
    # Prefer the .gz files the build stage wrote over compressing per request.
    gzip_static       on;

    # Caching is decided here, in one map, rather than with per-location
    # add_header directives — an add_header inside a location silently drops
    # every header inherited from the server block, security ones included.
    map $uri $cache_control {
        # index.html, and every client-side route that falls back to it. A
        # cached copy would hide a deploy until the browser gave up on it.
        default                                  "no-cache";
        # Vite writes content hashes into these filenames.
        ~^/assets/                               "public, max-age=31536000, immutable";
        # Unhashed static files: fresh within a week is close enough.
        ~*\.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ "public, max-age=604800";
    }

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # $uri is re-evaluated after the try_files fallback below, so the map
        # sees /index.html — not the client-side route that was requested.
        add_header  Cache-Control            $cache_control  always;
        add_header  X-Content-Type-Options   nosniff         always;
        add_header  X-Frame-Options          DENY            always;
        add_header  Referrer-Policy          strict-origin-when-cross-origin  always;

        # Orchestrator probe: no filesystem hit, and kept out of the log.
        location = /healthz {
            access_log  off;
            default_type  text/plain;
            return  200  "ok\n";
        }

        # A miss under /assets/ is a broken build, not a route — 404 it rather
        # than handing back the app shell with a text/html content type.
        location /assets/ {
            access_log  off;
            try_files   $uri =404;
        }

        # Client-side routing: anything that is not a file renders the app.
        location / {
            try_files  $uri $uri/ /index.html;
        }
    }
}
